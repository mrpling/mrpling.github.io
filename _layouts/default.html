<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>

<body>
  <div class="wrapper">

    <header>
      <h1>
        <a href="{{ '/' | absolute_url }}">rdap.ai Notes</a>
      </h1>

      <p>{{ site.description }}</p>

      <p>
        <a href="https://rdap.ai/">← rdap.ai</a>
      </p>
    </header>

    <section>
      {{ content }}
    </section>

    <footer>
      <p>
        <small>
          Notes from <a href="https://rdap.ai/">rdap.ai</a>
        </small>
      </p>
    </footer>

  </div>

  <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
</body>
</html>
